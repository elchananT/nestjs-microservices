syntax = "proto3";

package productV2;

service ProductService {
  rpc GetProduct (GetProductRequest) returns (Product);
}

message GetProductRequest {
  int32 id = 1;
}

message Product {
  int32 id = 1;
  string name = 2;
  double price = 3;
  Metadata metadata = 4;
}

message Metadata {
  string description = 1;
  repeated string tags = 2;
}