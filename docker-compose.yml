services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    ports:
      - "5432:5432"

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order
    ports:
      - "5433:5432"

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user
    ports:
      - "5434:5432"


  discovery-service:
    build:
      context: .
      dockerfile: apps/discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "4000:4000"
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: product-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@product-db:5432/product
      KAFKA_BROKERS: kafka:9092
      SERVICE_URL: http://product-service:3000
      DISCOVERY_URL: http://discovery-service:4000
      GRPC_URL: 0.0.0.0:5001
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    depends_on:
      product-db:
        condition: service_started
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: order-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order
      KAFKA_BROKERS: kafka:9092
      SERVICE_URL: http://order-service:3001
      DISCOVERY_URL: http://discovery-service:4000
      PRODUCT_GRPC_URL: product-service:5001
      PRODUCT_SERVICE_URL: http://product-service:3000
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_started
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/user
      SERVICE_URL: http://user-service:3002
      DISCOVERY_URL: http://discovery-service:4000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_started
      discovery-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      DISCOVERY_URL: http://discovery-service:4000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_started
