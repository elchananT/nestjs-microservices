apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: learning-microservices

data:
  loki.yml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      
    common:
      path_prefix: /loki
      
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
          
      ring:
        instance_addr: 127.0.0.1
        
        kvstore:
          store: inmemory
          
      replication_factor: 1
      
    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          
          index:
            prefix: index_
            period: 24h
            
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 6h

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: learning-microservices

spec:
  type: ClusterIP

  selector:
    app: loki

  ports:
    - name: http
      port: 3100
      targetPort: 3100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2

          args:
            - -config.file=/etc/loki/loki.yml

          ports:
            - containerPort: 3100
              name: http

          resources:
            requests:
              memory: 200Mi
            limits:
              memory: 300Mi

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: storage
              mountPath: /loki

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: storage
          emptyDir: {}