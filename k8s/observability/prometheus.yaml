apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: learning-microservices

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: learning-microservices

rules:
  - apiGroups:
      - ""

    resources:
      - pods

    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: learning-microservices

subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: learning-microservices

roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: learning-microservices

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      
    scrape_configs:
      - job_name: kubernetes-pods
        
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - learning-microservices
    
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: 'true'
              
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            separator: ';'
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
                  
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            regex: (.+)
            target_label: __metrics_path__
                  
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: service
              
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
            
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h

          ports:
            - containerPort: 9090
              name: http

          resources:
            requests:
              memory: 200Mi
            limits:
              memory: 300Mi

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: learning-microservices
spec:
  selector:
    app: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: 9090