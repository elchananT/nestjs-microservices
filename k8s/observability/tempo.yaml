apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: learning-microservices

data:
  tempo.yml: |
    target: all
    
    server:
      http_listen_port: 3200
      
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              
            http:
              endpoint: 0.0.0.0:4318
              
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/traces
          
    compactor:
      compaction:
        block_retention: 6h

---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: learning-microservices

spec:
  selector:
    app: tempo

  ports:
    - name: http
      port: 3200
      targetPort: 3200

    - name: otlp-grpc
      port: 4317
      targetPort: 4317

    - name: otlp-http
      port: 4318
      targetPort: 4318

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1

          args:
            - -config.file=/etc/tempo/tempo.yml

          ports:
            - containerPort: 3200
              name: http

            - containerPort: 4317
              name: otlp-grpc

            - containerPort: 4318
              name: otlp-http

          resources:
            requests:
              memory: 150Mi
            limits:
              memory: 250Mi

          volumeMounts:
            - name: config
              mountPath: /etc/tempo

            - name: storage
              mountPath: /etc/tempo

      volumes:
        - name: config
          configMap:
            name: tempo-config

        - name: storage
          emptyDir: {}