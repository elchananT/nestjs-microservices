apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: learning-microservices

data:
  datasources.yml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        
      - name: Loki
        type: loki
        url: http://loki:3100
        uid: loki
        
      - name: Tempo
        type: tempo
        url: http://tempo:3200
        uid: tempo

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: learning-microservices

data:
  provider.yml: |
    apiVersion: 1
    
    providers:
      - name: observability
        orgId: 1
        folder: Observability
        folderUid: observability
        type: file
        disableDeletion: false
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: learning-microservices

data:
  observability.json: |
    {
      "title": "Microservices Observability",
      "uid": "microservices-observability",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP 5xx Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Average Request Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum[1m])) by (service) / sum(rate(http_server_requests_seconds_count[1m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Application Logs",
          "type": "logs",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{namespace=\"learning-microservices\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0

          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"

            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"

            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"

          resources:
            requests:
              memory: 200Mi
            limits:
              memory: 300Mi

          ports:
            - containerPort: 3000
              name: http

          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources

            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards

            - name: dashboard
              mountPath: /etc/grafana/dashboards

      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources

        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: dashboard
          configMap:
            name: grafana-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: learning-microservices

spec:
  type: NodePort
  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030