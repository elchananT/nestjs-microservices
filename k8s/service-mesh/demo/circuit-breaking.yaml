apiVersion: networking.istio.io/v1
kind: VirtualService

metadata:
  name: product-service
  namespace:  learning-microservices

spec:
  hosts:
    - product-service

  http:
    - route:
        - destination:
            host: product-service
            subset: v1
            port:
              number: 3000

      timeout: 5s
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: product-service
  namespace: learning-microservices

spec:
  host: product-service

  subsets:
    - name: v1
      labels:
        version: v1

      trafficPolicy:
        connectionPool:
          tcp:
            maxConnections: 1
            connectTimeout: 1s

          http:
            http1MaxPendingRequests: 1
            maxRequestsPerConnection: 1
    - name: v2
      labels:
        version: v2
