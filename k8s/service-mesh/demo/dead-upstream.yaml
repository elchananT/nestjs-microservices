apiVersion: v1
kind: Service
metadata:
  name: dead-upstream
  namespace: learning-microservices

spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dead-upstream
  namespace: learning-microservices

subsets:
  - addresses:
      - ip: 10.244.0.200

    ports:
      - name: http
        port: 3000
