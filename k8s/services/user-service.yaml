apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: learning-microservices-user-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3002

          envFrom:
            - configMapRef:
                name: config

            - secretRef:
                name: secret

          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@user-db:5432/user-db

            - name: SERVICE_URL
              value: http://user-service:3002
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: learning-microservices

spec:
  selector:
    app: user-service

  ports:
    - port: 3002
      targetPort: 3002
