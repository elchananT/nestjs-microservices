apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: learning-microservices-order-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          envFrom:
            - configMapRef:
                name: config

            - secretRef:
                name: secret

          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@order-db:5432/order-db

            - name: SERVICE_URL
              value: http://order-service:3001
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: learning-microservices

spec:
  selector:
    app: order-service

  ports:
    - port: 3001
      targetPort: 3001
