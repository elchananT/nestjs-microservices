apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: product-service
          image: learning-microservices-product-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
            - containerPort: 5001

          envFrom:
            - configMapRef:
                name: config

            - secretRef:
                name: secret

          env:
            - name: OTEL_SERVICE_NAME
              value: product-service

            - name: DATABASE_URL
              value: postgresql://postgres:postgres@product-db:5432/product-db
            - name: SERVICE_URL
              value: http://product-service:3000
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: learning-microservices

spec:
  selector:
    app: product-service

  ports:
    - name: http
      port: 3000
      targetPort: 3000

    - name: grpc
      port: 5001
      targetPort: 5001
