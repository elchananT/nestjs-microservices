apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: learning-microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: learning-microservices-api-gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: config

            - secretRef:
                name: secret

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: learning-microservices

spec:
  type: NodePort

  selector:
    app: api-gateway

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
